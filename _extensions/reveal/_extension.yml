title: Quarto Tech Memo (Reveal.js Slides)
author: Gaël Close
version: 0.1.0
quarto-required: ">=1.7.33"
contributes:
  formats:
    revealjs:
      filters:
        - custom.lua
      brand: _brand.yml
      theme:
        - brand
        - custom.scss
      width: 1280
      height: 720
      margin: 0
      center: false
      transition: none
      slide-number: c/t
      scrollable: true
      embed-resources: true
      shift-heading-level-by: 0
      link-citation: true
      csl: ieee-with-url.csl
